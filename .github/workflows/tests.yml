name: tests

# 只验证与 AutoCAD 无关的那部分：CadMath.Core（计算与判定）、
# CadMath.Abstractions（契约/清单/选择）以及 tests/CadMath.Tests 里的断言。
# Shell 与 CadMath.Adapter.Modern 是 net8.0-windows，且编译需要 Autodesk 的
# 托管程序集（acmgd 等，属 Autodesk 版权文件，不能进 runner，也不能进仓库），
# 所以这两个工程的编译只能在装了 CAD 的 Windows 上验证，见 docs/IMPLEMENTATION.md。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 只还原/构建测试工程，不用 dotnet build CadMath.sln：
      # 解决方案里含有 net8.0-windows 工程，在 Linux 上会以 NETSDK1100 失败。
      # 测试工程通过 ProjectReference 连带构建 Core 与 Abstractions，两者都是 net8.0。
      - name: Restore
        run: dotnet restore tests/CadMath.Tests/CadMath.Tests.csproj

      - name: Build
        run: dotnet build tests/CadMath.Tests/CadMath.Tests.csproj -c Release --no-restore

      # 运行器是自写的控制台断言，失败时返回退出码 1（tests/CadMath.Tests/Program.cs:34）。
      - name: Run assertions
        run: dotnet run --project tests/CadMath.Tests -c Release --no-build
